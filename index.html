<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tebak Gambar Multiplayer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-slate-800 rounded-3xl p-8 border border-slate-700 shadow-2xl text-center space-y-6">
        <div class="inline-block p-4 bg-indigo-500/10 rounded-2xl text-indigo-400 mb-2">
            <i class="fa-solid fa-gamepad text-5xl"></i>
        </div>
        <h1 class="text-3xl font-extrabold text-indigo-400">Tebak Gambar Live</h1>
        <p class="text-slate-400 text-sm">Pilih profil pemain pada device ini untuk memulai:</p>

        <div class="space-y-4 pt-4">
            <a href="player1.html" class="w-full flex items-center justify-between p-4 bg-slate-700 hover:bg-indigo-600 transition duration-200 rounded-2xl font-bold text-lg group shadow-lg">
                <span class="flex items-center gap-3">
                    <i class="fa-solid fa-user-ninja text-indigo-400 group-hover:text-white text-2xl"></i>
                    <span>Nadilla</span>
                </span>
                <i class="fa-solid fa-arrow-right text-slate-400 group-hover:text-white"></i>
            </a>

            <a href="player2.html" class="w-full flex items-center justify-between p-4 bg-slate-700 hover:bg-emerald-600 transition duration-200 rounded-2xl font-bold text-lg group shadow-lg">
                <span class="flex items-center gap-3">
                    <i class="fa-solid fa-user-astronaut text-emerald-400 group-hover:text-white text-2xl"></i>
                    <span>Muhammad Dede Imran</span>
                </span>
                <i class="fa-solid fa-arrow-right text-slate-400 group-hover:text-white"></i>
            </a>
        </div>
        
        <p class="text-xs text-slate-500 pt-4">Buka masing-masing link profil pada 2 HP/device berbeda.</p>
    </div>

</body>
</html>
