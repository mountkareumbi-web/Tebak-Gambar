<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nadilla - Tebak Gambar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-900 text-slate-100 font-sans h-screen flex flex-col justify-between overflow-hidden">

    <!-- Audio Backsound Autoplay & Loop -->
    <audio id="bgMusic" src="backsound.mp3" loop autoplay></audio>

    <!-- Header Ringkas -->
    <header class="bg-slate-800/90 backdrop-blur border-b border-slate-700 px-4 py-2 flex items-center justify-between z-50 flex-shrink-0">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded-full overflow-hidden bg-indigo-600 border border-indigo-400 shadow-md flex items-center justify-center">
                <img src="player1.png" alt="Nadilla" class="w-full h-full object-cover">
            </div>
            <div>
                <h1 class="font-bold text-xs leading-tight text-indigo-300">Nadilla (P1)</h1>
                <p class="text-[10px] text-slate-400"><span id="connStatus" class="text-amber-400 font-bold">Menghubungkan...</span></p>
            </div>
        </div>
        
        <div class="flex items-center gap-4 text-center">
            <div>
                <div class="text-[9px] text-slate-400 uppercase font-semibold">Skor</div>
                <div id="scoreText" class="text-xs font-black text-indigo-400">0 : 0</div>
            </div>
            <div>
                <div class="text-[9px] text-slate-400 uppercase font-semibold">Ronde</div>
                <div id="roundText" class="text-xs font-black text-indigo-400">1/20</div>
            </div>
            <div>
                <div class="text-[9px] text-slate-400 uppercase font-semibold">Waktu</div>
                <div id="timerText" class="text-xs font-black text-amber-400">00:50</div>
            </div>
        </div>
    </header>

    <!-- Main Body Compact (Tanpa Scroll) -->
    <main class="flex-1 max-w-4xl w-full mx-auto p-2 flex flex-col gap-2 overflow-hidden">
        
        <!-- Lobby Ready -->
        <div id="lobbySection" class="w-full h-full bg-slate-800 border border-slate-700 rounded-2xl p-6 flex flex-col items-center justify-center text-center space-y-4 my-auto">
            <h2 class="text-xl font-bold text-indigo-400">Ruang Tunggu Real-Time</h2>
            <p class="text-slate-300 text-xs">Buka link <code class="bg-slate-900 px-2 py-1 rounded text-emerald-400">player2.html</code> di HP Dede.</p>
            
            <div class="flex gap-3 w-full justify-center max-w-sm">
                <div class="p-3 bg-slate-700/50 rounded-xl flex-1 border border-slate-600 text-xs">
                    <div class="text-[10px] text-slate-400">Nadilla</div>
                    <div id="p1StatusText" class="font-bold text-amber-400">Belum Siap</div>
                </div>
                <div class="p-3 bg-slate-700/50 rounded-xl flex-1 border border-slate-600 text-xs">
                    <div class="text-[10px] text-slate-400">Dede</div>
                    <div id="p2StatusText" class="font-bold text-amber-400">Belum Siap</div>
                </div>
            </div>

            <button id="readyBtn" onclick="toggleReady()" class="w-full max-w-sm py-3 rounded-xl font-bold text-sm bg-indigo-600 hover:bg-indigo-500 text-white transition shadow-lg">
                SAYA SIAP
            </button>
        </div>

        <!-- Word Selection Section -->
        <div id="wordSelectSection" class="hidden w-full h-full bg-slate-800 border border-slate-700 rounded-2xl p-6 flex flex-col items-center justify-center text-center space-y-4 my-auto">
            <h2 id="wordSelectTitle" class="text-xl font-bold text-indigo-400">Giliran Anda Menggambar!</h2>
            <p id="wordSelectDesc" class="text-slate-300 text-xs">Pilih salah satu kata di bawah ini:</p>
            <div id="wordOptionsContainer" class="grid grid-cols-2 gap-2 w-full max-w-sm"></div>
        </div>

        <!-- Gameplay Section (Persegi Panjang & Muat di Layar HP) -->
        <div id="gameSection" class="hidden flex-1 flex flex-col gap-2 w-full overflow-hidden">
            
            <!-- Canvas Area (Dibuat Persegi Panjang / Tipis ke Atas) -->
            <div class="bg-slate-800 border border-slate-700 rounded-2xl p-2 flex flex-col shadow-md flex-1">
                <div class="flex justify-between items-center px-1 mb-1">
                    <span id="canvasHeader" class="text-xs font-semibold text-slate-300">Layar Gambar</span>
                    <button id="clearBtn" onclick="clearCanvasAction()" class="text-[10px] bg-rose-500/20 text-rose-300 border border-rose-500/30 px-2 py-0.5 rounded hover:bg-rose-500/30 transition">
                        <i class="fa-solid fa-trash mr-1"></i> Hapus
                    </button>
                </div>

                <!-- Kontainer Kanvas Landscape / Persegi Panjang -->
                <div id="canvasContainer" class="relative w-full bg-white rounded-xl overflow-hidden border border-slate-700 flex-1 min-h-[160px] max-h-[220px]">
                    <canvas id="paintCanvas" class="w-full h-full cursor-crosshair touch-none absolute inset-0"></canvas>
                </div>

                <!-- Color & Tools Compact -->
                <div id="drawingTools" class="mt-1.5 flex flex-wrap items-center justify-between gap-1 bg-slate-900/60 p-1.5 rounded-xl border border-slate-700/50">
                    <div class="flex items-center gap-1.5">
                        <button onclick="setColor('#000000', this)" class="color-btn w-5 h-5 rounded-full bg-black border border-slate-400 ring-2 ring-indigo-400" data-color="#000000"></button>
                        <button onclick="setColor('#ef4444', this)" class="color-btn w-5 h-5 rounded-full bg-red-500" data-color="#ef4444"></button>
                        <button onclick="setColor('#3b82f6', this)" class="color-btn w-5 h-5 rounded-full bg-blue-500" data-color="#3b82f6"></button>
                        <button onclick="setColor('#10b981', this)" class="color-btn w-5 h-5 rounded-full bg-emerald-500" data-color="#10b981"></button>
                        <button onclick="setColor('#f59e0b', this)" class="color-btn w-5 h-5 rounded-full bg-amber-500" data-color="#f59e0b"></button>
                        <button onclick="setColor('#ffffff', this)" class="color-btn w-5 h-5 rounded-full bg-white border border-slate-600 flex items-center justify-center text-[10px] text-slate-800" data-color="#ffffff" title="Penghapus"><i class="fa-solid fa-eraser"></i></button>
                        <button id="fillToolBtn" onclick="toggleFillTool()" class="w-5 h-5 rounded-full bg-indigo-600 flex items-center justify-center text-[10px] text-white" title="Cat Tumpah"><i class="fa-solid fa-fill-drip"></i></button>
                    </div>
                    <div class="flex items-center gap-1">
                        <button onclick="setLineWidth(3)" class="px-2 py-0.5 bg-slate-700 text-[10px] rounded font-bold">Kecil</button>
                        <button onclick="setLineWidth(6)" class="px-2 py-0.5 bg-slate-700 text-[10px] rounded font-bold">Sedang</button>
                        <button onclick="setLineWidth(10)" class="px-2 py-0.5 bg-slate-700 text-[10px] rounded font-bold">Besar</button>
                    </div>
                </div>
            </div>

            <!-- Panel Status & Kolom Tebakan (Selalu Tampak di Bawah Tanpa Scroll) -->
            <div class="bg-slate-800 border border-slate-700 rounded-2xl p-2.5 flex flex-col justify-between shadow-md flex-shrink-0">
                <div id="guessBox" class="bg-slate-900 border border-slate-700 rounded-xl p-2 text-center text-xs min-h-[40px] flex items-center justify-center">
                    <span class="text-slate-500 italic">Menunggu permainan...</span>
                </div>

                <div id="guesserInputBox" class="mt-2 pt-1 border-t border-slate-700">
                    <div class="flex gap-1.5">
                        <input type="text" id="guessInput" placeholder="Ketik tebakan di sini..." class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-3 py-1.5 text-xs focus:outline-none focus:border-indigo-500">
                        <button onclick="submitGuessAction()" class="bg-indigo-600 hover:bg-indigo-500 px-3 py-1.5 rounded-xl font-bold text-xs text-white">Kirim</button>
                    </div>
                </div>
            </div>

        </div>

    </main>

    <script>
        const MY_NAME = "Nadilla";
        const ROOM_ID = "tebak_gambar_nadilla_dede_room_2026";
        const WORD_LIST = [
            "Meja", "Kursi", "Lemari", "Pintu", "Jendela", "Kasur", "Bantal", "Guling", "Selimut", "Jam", "Lampu", "AC", "Televisi", "Radio", "Komputer", "Laptop", "Mouse", "Printer", "HP", "Kamera", "Buku", "Pensil", "Pulpen", "Penghapus", "Tas", "Sepatu", "Topi", "Jaket", "Baju", "Celana", "Kacamata", "Payung", "Helm", "Masker", "Sabun", "Handuk", "Sapu", "Kulkas", "Kompor", "Panci", "Wajan", "Pisau", "Sendok", "Garpu", "Piring", "Gelas", "Teko", "Botol",
            "Kucing", "Anjing", "Kelinci", "Hamster", "Kuda", "Sapi", "Kambing", "Domba", "Gajah", "Jerapah", "Zebra", "Monyet", "Beruang", "Panda", "Koala", "Kanguru", "Harimau", "Singa", "Paus", "Lumba", "Hiu", "Ikan", "Bebek", "Angsa", "Penguin", "Flamingo", "Ayam", "Burung", "Ular", "Katak", "Kupu", "Lebah", "Semut", "Nyamuk", "Lalat", "Kepiting", "Cumi", "Siput",
            "Apel", "Jeruk", "Mangga", "Pisang", "Pepaya", "Nanas", "Semangka", "Melon", "Anggur", "Stroberi", "Ceri", "Pir", "Kiwi", "Alpukat", "Jambu", "Rambutan", "Durian", "Manggis", "Kelengkeng", "Leci", "Sawo", "Sirsak", "Nangka", "Belimbing", "Delima", "Kurma", "Kelapa", "Salak", "Pala", "Naga"
        ];
        
        let peer = null, conn = null;
        let isP1Ready = false, isP2Ready = false;
        let gameState = { 
            status: 'LOBBY', 
            currentRound: 1, 
            currentArtist: 'Nadilla', 
            selectedWord: '', 
            timeLeft: 50, 
            canvasData: [], 
            lastGuessResult: null, 
            scores: { "Nadilla": 0, "Muhammad Dede Imran": 0 }
        };
        let canvas, ctx, drawing = false;
        let currentColor = "#000000", currentLineWidth = 6;
        let isFillMode = false;
        let timerInterval = null;

        window.addEventListener('DOMContentLoaded', () => {
            initCanvas();
            initPeer();
            setupAutoplayMusic();
        });

        function setupAutoplayMusic() {
            const music = document.getElementById('bgMusic');
            if (music) {
                music.volume = 0.4;
                music.play().catch(() => {
                    const handleFirstInteraction = () => {
                        music.play();
                        document.removeEventListener('click', handleFirstInteraction);
                        document.removeEventListener('touchstart', handleFirstInteraction);
                    };
                    document.addEventListener('click', handleFirstInteraction);
                    document.addEventListener('touchstart', handleFirstInteraction);
                });
            }
        }

        function initCanvas() {
            canvas = document.getElementById('paintCanvas');
            ctx = canvas.getContext('2d');
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);

            canvas.addEventListener('mousedown', handleCanvasClick);
            canvas.addEventListener('touchstart', (e) => { handleCanvasClick(e.touches[0]); e.preventDefault(); }, {passive: false});

            canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('mouseup', stopDraw);
            canvas.addEventListener('mouseleave', stopDraw);
            canvas.addEventListener('touchmove', (e) => { draw(e.touches[0]); e.preventDefault(); }, {passive: false});
            canvas.addEventListener('touchend', stopDraw);
        }

        function resizeCanvas() {
            const container = document.getElementById('canvasContainer');
            if (!container || !canvas) return;
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            if (gameState.canvasData) redrawCanvas(gameState.canvasData);
        }

        function initPeer() {
            peer = new Peer(ROOM_ID);

            peer.on('open', (id) => {
                document.getElementById('connStatus').innerText = "Menunggu Dede...";
            });

            peer.on('connection', (connection) => {
                conn = connection;
                setupConnection();
            });

            peer.on('error', (err) => {
                document.getElementById('connStatus').innerText = "Terhubung (Host)";
                document.getElementById('connStatus').className = "text-emerald-400 font-bold";
            });
        }

        function setupConnection() {
            document.getElementById('connStatus').innerText = "Terhubung!";
            document.getElementById('connStatus').className = "text-emerald-400 font-bold";

            conn.on('data', (data) => {
                handleIncomingData(data);
            });

            conn.on('close', () => {
                document.getElementById('connStatus').innerText = "Terputus";
                document.getElementById('connStatus').className = "text-rose-400 font-bold";
            });
        }

        function sendData(data) {
            if (conn && conn.open) conn.send(data);
        }

        function handleIncomingData(data) {
            if (data.type === 'READY_STATUS') {
                isP2Ready = data.p2Ready;
                updateLobbyUI();
                if (isP1Ready && isP2Ready && gameState.status === 'LOBBY') {
                    startNewRoundSetup();
                }
            } else if (data.type === 'GUESS_SUBMIT') {
                processGuess(data.guess);
            } else if (data.type === 'DRAW_STROKE') {
                gameState.canvasData.push(data.stroke);
                redrawCanvas(gameState.canvasData);
            } else if (data.type === 'CLEAR_CANVAS') {
                gameState.canvasData = [];
                clearCanvasScreen();
            } else if (data.type === 'FLOOD_FILL') {
                gameState.canvasData.push(data.stroke);
                redrawCanvas(gameState.canvasData);
            } else if (data.type === 'WORD_SELECTED') {
                gameState.selectedWord = data.word;
                gameState.status = 'PLAYING';
                syncStateToClient();
                renderGameUI();
                startServerTimer();
            } else if (data.type === 'STATE_SYNC') {
                gameState = data.gameState;
                renderGameUI();
            }
        }

        window.toggleReady = function() {
            isP1Ready = !isP1Ready;
            updateLobbyUI();
            sendData({ type: 'P1_READY_UPDATE', p1Ready: isP1Ready });

            if (isP1Ready && isP2Ready && gameState.status === 'LOBBY') {
                startNewRoundSetup();
            }
        };

        function updateLobbyUI() {
            document.getElementById('p1StatusText').innerText = isP1Ready ? "SIAP" : "Belum Siap";
            document.getElementById('p1StatusText').className = isP1Ready ? "font-bold text-emerald-400" : "font-bold text-amber-400";

            document.getElementById('p2StatusText').innerText = isP2Ready ? "SIAP" : "Belum Siap";
            document.getElementById('p2StatusText').className = isP2Ready ? "font-bold text-emerald-400" : "font-bold text-amber-400";

            const btn = document.getElementById('readyBtn');
            if (isP1Ready) {
                btn.innerText = isP2Ready ? "MEMULAI..." : "MENUNGGU DEDE...";
                btn.className = "w-full max-w-sm py-3 rounded-xl font-bold text-sm bg-slate-700 text-slate-400 cursor-not-allowed";
            } else {
                btn.innerText = "SAYA SIAP";
                btn.className = "w-full max-w-sm py-3 rounded-xl font-bold text-sm bg-indigo-600 hover:bg-indigo-500 text-white transition shadow-lg";
            }
        }

        function startNewRoundSetup() {
            if (timerInterval) clearInterval(timerInterval);
            gameState.status = 'SELECTING_WORD';
            gameState.canvasData = [];
            gameState.selectedWord = '';
            gameState.lastGuessResult = null;
            gameState.timeLeft = 50;

            syncStateToClient();
            renderGameUI();
        }

        function syncStateToClient() {
            sendData({ type: 'STATE_SYNC', gameState: gameState });
        }

        function renderGameUI() {
            document.getElementById('lobbySection').classList.add('hidden');
            document.getElementById('wordSelectSection').classList.add('hidden');
            document.getElementById('gameSection').classList.add('hidden');

            document.getElementById('scoreText').innerText = `${gameState.scores["Nadilla"]} : ${gameState.scores["Muhammad Dede Imran"]}`;
            document.getElementById('roundText').innerText = `${gameState.currentRound}/20`;
            document.getElementById('timerText').innerText = `00:${gameState.timeLeft < 10 ? '0' + gameState.timeLeft : gameState.timeLeft}`;

            if (gameState.status === 'SELECTING_WORD') {
                document.getElementById('wordSelectSection').classList.remove('hidden');
                if (gameState.currentArtist === MY_NAME) {
                    document.getElementById('wordSelectTitle').innerText = "Giliran Anda Menggambar!";
                    document.getElementById('wordSelectDesc').innerText = "Pilih salah satu kata di bawah ini:";
                    setupWordChoices();
                } else {
                    document.getElementById('wordSelectTitle').innerText = `Menunggu ${gameState.currentArtist}...`;
                    document.getElementById('wordSelectDesc').innerText = "Sedang memilih kata untuk digambar.";
                    document.getElementById('wordOptionsContainer').innerHTML = `<p class="col-span-2 text-slate-400 italic text-xs">Mohon tunggu...</p>`;
                }
            } else if (gameState.status === 'PLAYING' || gameState.status === 'GAMEOVER') {
                document.getElementById('gameSection').classList.remove('hidden');
                setTimeout(resizeCanvas, 50);

                const isMyTurn = gameState.currentArtist === MY_NAME;
                document.getElementById('canvasHeader').innerText = isMyTurn ? `Gambarmu (Kata: ${gameState.selectedWord})` : `Live: ${gameState.currentArtist}`;

                document.getElementById('drawingTools').style.display = isMyTurn ? 'flex' : 'none';
                document.getElementById('clearBtn').style.display = isMyTurn ? 'block' : 'none';
                document.getElementById('guesserInputBox').style.display = !isMyTurn ? 'block' : 'none';

                redrawCanvas(gameState.canvasData);

                const guessBox = document.getElementById('guessBox');
                if (gameState.lastGuessResult) {
                    const iconColor = gameState.lastGuessResult.isCorrect ? 'text-emerald-400' : 'text-rose-400';
                    const mark = gameState.lastGuessResult.isCorrect ? '✓' : '✗';
                    guessBox.innerHTML = `
                        <div class="font-bold text-xs text-slate-200">Jawaban : "${gameState.lastGuessResult.guess}" <span class="${iconColor} text-base font-black ml-1">${mark}</span></div>
                        <p class="text-[10px] text-slate-400 mt-0.5">${gameState.lastGuessResult.msg}</p>
                    `;
                } else {
                    guessBox.innerHTML = `<span class="text-slate-500 italic text-xs">${isMyTurn ? 'Menunggu tebakan Dede...' : 'Ketik tebakanmu di bawah!'}</span>`;
                }
            }
        }

        function setupWordChoices() {
            const container = document.getElementById('wordOptionsContainer');
            container.innerHTML = '';
            const shuffled = [...WORD_LIST].sort(() => 0.5 - Math.random());
            const choices = shuffled.slice(0, 4);

            choices.forEach(word => {
                const btn = document.createElement('button');
                btn.className = "p-2.5 bg-slate-700 hover:bg-indigo-600 rounded-xl font-bold text-xs text-white transition";
                btn.innerText = word;
                btn.onclick = () => selectWord(word);
                container.appendChild(btn);
            });
        }

        window.selectWord = function(word) {
            gameState.selectedWord = word;
            gameState.status = 'PLAYING';
            sendData({ type: 'WORD_SELECTED', word: word });
            renderGameUI();
            startServerTimer();
        }

        function startServerTimer() {
            if (timerInterval) clearInterval(timerInterval);
            gameState.timeLeft = 50;

            timerInterval = setInterval(() => {
                if (gameState.status !== 'PLAYING') {
                    clearInterval(timerInterval);
                    return;
                }

                if (gameState.timeLeft > 0) {
                    gameState.timeLeft--;
                    syncStateToClient();
                    renderGameUI();
                } else {
                    clearInterval(timerInterval);
                    autoFinishRound(`Waktu Habis! Jawabannya: ${gameState.selectedWord}`, false);
                }
            }, 1000);
        }

        function processGuess(guess) {
            if (gameState.status !== 'PLAYING') return;
            const guessClean = guess.trim().toLowerCase();
            const targetClean = gameState.selectedWord.trim().toLowerCase();
            const guesserName = gameState.currentArtist === "Nadilla" ? "Muhammad Dede Imran" : "Nadilla";

            if (guessClean === targetClean) {
                let addedPoint = gameState.timeLeft >= 20 ? 10 : 5;
                gameState.scores[guesserName] += addedPoint;
                autoFinishRound(`${guesserName} BENAR! (+${addedPoint} Poin)`, true, guess);
            } else {
                // JIKA SALAH, RONDE SELESAI DAN BERGANTI GILIRAN SEPERTI DIMINTA
                autoFinishRound(`${guesserName} SALAH menebak. Jawabannya: ${gameState.selectedWord}`, false, guess);
            }
        }

        function autoFinishRound(msg, isCorrect, guessWord = "") {
            if (timerInterval) clearInterval(timerInterval);
            gameState.lastGuessResult = {
                guess: guessWord || gameState.selectedWord,
                isCorrect: isCorrect,
                msg: msg
            };
            syncStateToClient();
            renderGameUI();

            setTimeout(() => {
                gameState.currentRound++;
                if (gameState.currentRound > 20) {
                    gameState.status = 'GAMEOVER';
                    alert("Game Selesai! 20 Ronde Telah Berakhir.");
                    syncStateToClient();
                } else {
                    gameState.status = 'SELECTING_WORD';
                    gameState.currentArtist = gameState.currentArtist === "Nadilla" ? "Muhammad Dede Imran" : "Nadilla";
                    gameState.timeLeft = 50;
                    gameState.canvasData = [];
                    gameState.lastGuessResult = null;
                    gameState.selectedWord = '';
                    syncStateToClient();
                    renderGameUI();
                }
            }, 2500);
        }

        function handleCanvasClick(e) {
            if (gameState.currentArtist !== MY_NAME || gameState.status !== 'PLAYING') return;
            const pos = getPos(e);

            if (isFillMode) {
                performFloodFill(Math.floor(pos.x * canvas.width), Math.floor(pos.y * canvas.height), currentColor);
                isFillMode = false;
                document.getElementById('fillToolBtn').classList.remove('ring-4', 'ring-amber-400');
            } else {
                drawing = true;
                addStroke(pos.x, pos.y, false);
            }
        }

        function draw(e) {
            if (!drawing || gameState.currentArtist !== MY_NAME || gameState.status !== 'PLAYING' || isFillMode) return;
            const pos = getPos(e);
            addStroke(pos.x, pos.y, true);
        }

        function stopDraw() { drawing = false; }

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.clientX !== undefined ? e.clientX : (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
            const clientY = e.clientY !== undefined ? e.clientY : (e.touches && e.touches[0] ? e.touches[0].clientY : 0);
            return {
                x: (clientX - rect.left) / rect.width,
                y: (clientY - rect.top) / rect.height
            };
        }

        function addStroke(x, y, dragging) {
            const stroke = { type: 'path', x, y, dragging, color: currentColor, size: currentLineWidth };
            gameState.canvasData.push(stroke);
            drawSingleStroke(stroke, gameState.canvasData[gameState.canvasData.length - 2]);
            sendData({ type: 'DRAW_STROKE', stroke: stroke });
        }

        function clearCanvasScreen() {
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function drawSingleStroke(p, prevP) {
            if (p.type === 'fill') {
                performFloodFill(Math.floor(p.startX * canvas.width), Math.floor(p.startY * canvas.height), p.color, false);
                return;
            }
            ctx.strokeStyle = p.color;
            ctx.lineWidth = p.size;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.beginPath();
            if (p.dragging && prevP && prevP.type !== 'fill') {
                ctx.moveTo(prevP.x * canvas.width, prevP.y * canvas.height);
            } else {
                ctx.moveTo(p.x * canvas.width - 0.5, p.y * canvas.height);
            }
            ctx.lineTo(p.x * canvas.width, p.y * canvas.height);
            ctx.stroke();
        }

        function redrawCanvas(data) {
            clearCanvasScreen();
            for (let i = 0; i < data.length; i++) {
                const p = data[i];
                const prevP = (p.dragging && i > 0) ? data[i - 1] : null;
                drawSingleStroke(p, prevP);
            }
        }

        window.toggleFillTool = function() {
            if (gameState.currentArtist !== MY_NAME) return;
            isFillMode = !isFillMode;
            const btn = document.getElementById('fillToolBtn');
            if (isFillMode) {
                btn.classList.add('ring-2', 'ring-amber-400');
            } else {
                btn.classList.remove('ring-2', 'ring-amber-400');
            }
        };

        function performFloodFill(startX, startY, fillColor, broadcast = true) {
            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imgData.data;
            const targetColor = getPixelColor(data, startX, startY, canvas.width);
            const replacementColor = hexToRgba(fillColor);

            if (colorsMatch(targetColor, replacementColor)) return;

            const queue = [[startX, startY]];
            const visited = new Uint8Array(canvas.width * canvas.height);

            while (queue.length > 0) {
                const [x, y] = queue.pop();
                if (x < 0 || x >= canvas.width || y < 0 || y >= canvas.height) continue;
                const idx = y * canvas.width + x;
                if (visited[idx]) continue;
                visited[idx] = 1;

                const currColor = getPixelColor(data, x, y, canvas.width);
                if (colorsMatch(currColor, targetColor)) {
                    setPixelColor(data, x, y, canvas.width, replacementColor);
                    queue.push([x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]);
                }
            }
            ctx.putImageData(imgData, 0, 0);

            if (broadcast) {
                const stroke = { type: 'fill', startX: startX / canvas.width, startY: startY / canvas.height, color: fillColor };
                gameState.canvasData.push(stroke);
                sendData({ type: 'FLOOD_FILL', stroke: stroke });
            }
        }

        function getPixelColor(data, x, y, width) {
            const i = (y * width + x) * 4;
            return [data[i], data[i+1], data[i+2], data[i+3]];
        }

        function setPixelColor(data, x, y, width, color) {
            const i = (y * width + x) * 4;
            data[i] = color[0];
            data[i+1] = color[1];
            data[i+2] = color[2];
            data[i+3] = color[3];
        }

        function colorsMatch(a, b) {
            return a[0] === b[0] && a[1] === b[1] && a[2] === b[2] && a[3] === b[3];
        }

        function hexToRgba(hex) {
            let c = hex.replace('#','');
            if (c.length === 3) c = c.split('').map(x => x + x).join('');
            const num = parseInt(c, 16);
            return [num >> 16, (num >> 8) & 255, num & 255, 255];
        }

        window.setColor = function(c, btn) {
            currentColor = c;
            document.querySelectorAll('.color-btn').forEach(b => {
                b.classList.remove('ring-2', 'ring-indigo-400', 'ring-emerald-400');
            });
            if (btn) {
                btn.classList.add('ring-2', 'ring-indigo-400');
            }
        };

        window.setLineWidth = (w) => currentLineWidth = w;

        window.clearCanvasAction = function() {
            if (gameState.currentArtist === MY_NAME) {
                gameState.canvasData = [];
                clearCanvasScreen();
                sendData({ type: 'CLEAR_CANVAS' });
            }
        };

        window.submitGuessAction = function() {
            const val = document.getElementById('guessInput').value.trim();
            if (!val) return;
            sendData({ type: 'GUESS_SUBMIT', guess: val });
            document.getElementById('guessInput').value = '';
        };
    </script>
</body>
</html>
